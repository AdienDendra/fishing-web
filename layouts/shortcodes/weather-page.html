<div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>
{{ partial "weather-top.html" . }}
<div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>

<div id="graph-loading-overlay" style="display:none;" class="flex items-center justify-center py-8 text-sm text-neutral-400 dark:text-neutral-500 font-mono">
    <svg class="animate-spin h-5 w-5 mr-2 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 14.627 0 20 12h-4a4 4 0 00-4-4V4A8 8 0 014 12z"></path>
    </svg>
    Fetching weather data...
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full items-start">
    <div class="w-full bg-transparent">
        {{ partial "weather-graph-wave-swell-tide.html" . }}
    </div>
    <div class="w-full bg-transparent">
        {{ partial "weather-graph-period.html" . }}
    </div>
</div>

<div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>
<div class="w-full space-y-2 font-sans">
    <h3 class="text-sm font-mono font-bold text-neutral-700 dark:text-neutral-300 uppercase tracking-wider">
        🤖 AI FISHING ANALYSIS
    </h3>
    <div id="ai-analysis-panel" class="text-sm text-neutral-500 dark:text-neutral-400 italic">
        Press Check to load analysis...
    </div>
</div>

<div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>
