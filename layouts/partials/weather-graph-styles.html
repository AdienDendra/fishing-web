{{/*
    weather-graph-styles.html
    CSS terpusat untuk semua graph di weather page.
    Di-include SEKALI di weather-page.html sebelum blueprint calls.
    Jangan include di tempat lain — akan duplicate style.
*/}}
<style>
    /* ── Graph container ─────────────────────────────────────────── */
    .telemetry-container {
        background-color: transparent !important;
        overflow: visible !important;
    }

    /* Jarak antar graph */
    .weather-graph-grid {
        row-gap: 32px !important;
    }

    /* Wrapper graph dari weather-page.html */
    .graph-scroll {
        width: 100%;
        min-width: 0;
        background: transparent;
        overflow: hidden;
    }

    /* Mobile only: horizontal slider */
    @media (max-width: 767px) {
        .weather-graph-grid {
            row-gap: 42px !important;
        }

        /* graph-scroll tidak scroll — biarkan title dan legend tetap centered */
        .graph-scroll {
            overflow: visible !important;
        }

        /* Scroll hanya pada SVG container */
        .telemetry-container {
            overflow-x: auto !important;
            overflow-y: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            padding-bottom: 14px !important;
        }

        .responsive-svg {
            width: 750px !important;
            min-width: 750px !important;
            max-width: none !important;
            height: auto !important;
        }
    }

    /* Desktop/tablet: no slider, graph fit column */
    @media (min-width: 768px) {
        .responsive-svg {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            height: auto !important;
        }
    }
    /* Fish activity readability */

    #fish-activity-value {
        font-weight: 600 !important;
        color: #334155 !important;
    }

    .dark #fish-activity-value {
        color: #e2e8f0 !important;
    }

    /* ── Data updated readability ─────────────────────────────── */
    #data-updated-time {
        font-weight: 700 !important;
        color: #334155 !important;
    }

    .dark #data-updated-time {
        color: #cbd5e1 !important;
    }    

    /* ── Safety status block ───────────────────────────────────── */
    .safety-status-block {
        text-align: center !important;
    }

    .safety-status-title {
        font-size: 15px !important;
        line-height: 1.35 !important;
        font-weight: 700 !important;
        color: var(--safety-color, #10b981) !important;
        text-transform: uppercase !important;
    }

    .safety-status-detail {
        margin-top: 4px !important;
        font-size: 14px !important;
        line-height: 1.45 !important;
        font-weight: 400 !important;
        color: #64748b !important;
    }

    .dark .safety-status-detail {
        color: #93a4b8 !important;
    }

    .safety-status-detail strong {
        font-weight: 600 !important;
        color: #1f2937 !important;
    }

    .dark .safety-status-detail strong {
        color: #e2e8f0 !important;
    }

    @media (max-width: 767px) {
        .safety-status-title {
            font-size: 14px !important;
        }

        .safety-status-detail {
            font-size: 13px !important;
        }
    }    

    /* ── Grid lines ──────────────────────────────────────────────── */
    .chart-grid-line { stroke: #e5e7eb; }
    .dark .chart-grid-line { stroke: #ffffff13; }

    /* ── Text sizes ──────────────────────────────────────────────── */
    .svg-text-micro  { font-size: 13px !important; }
    .svg-text-small  { font-size: 14px !important; }
    .font-size-micro { font-size: 14px !important; line-height: 12px !important; }

    /* ── Legend layout ───────────────────────────────────────────── */
    .legend-gap {
        display: flex !important; flex-wrap: wrap !important;
        align-items: center !important; gap: 12px 28px !important;
    }

    /* ── Series colours ──────────────────────────────────────────── */
    /* Wave — purple */
    .color-wave       { color: #9522ac; }
    .dark .color-wave { color: #d96fee; }

    /* Swell — blue */
    .color-swell       { color: #1871c5; }
    .dark .color-swell { color: #1d8cf3; }

    /* Tide — grey */
    .color-tide       { color: #7c7c7c; }
    .dark .color-tide { color: #9ca3af; }

    /* Wind — teal */
    .color-wind       { color: #0d9488; }
    .dark .color-wind { color: #2dd4bf; }

    /* Gust — orange */
    .color-gust       { color: #ea580c; }
    .dark .color-gust { color: #fb923c; }

    /* Dangerous threshold marker */
    .color-dangerous { color: #ef4444; }

    /* ── Dot interactivity ───────────────────────────────────────── */
    .graph-dot {
        r: 5px !important;
        transition: r 0.12s ease;
        cursor: pointer;
    }
    .graph-dot:hover { 
        r: 10px !important;
    }
    /* ── Tooltip ─────────────────────────────────────────────────── */
    .custom-graph-tooltip {
        position: absolute;
        display: none;
        pointer-events: none;
        background-color: color-mix(in srgb, var(--entry, #ffffff) 92%, transparent) !important;
        border: 1.5px solid var(--border, #e5e7eb) !important;
        border-radius: 6px !important;
        padding: 6px 10px !important;
        font-family: inherit !important;
        font-size: 11px !important;
        z-index: 50 !important;
        color: var(--primary, #1f2937) !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        width: max-content !important;
    }
    .tt-title {
        font-weight: bold;
        font-size: 12px !important;
        text-transform: uppercase;
        margin-bottom: 2px !important;
        line-height: 1.2 !important;
    }
    .tt-row {
        color: var(--secondary, #4b5563) !important;
        font-weight: 500;
        margin-top: 1px !important;
        line-height: 1.2 !important;
    }
    .tt-num {
        font-weight: bold;
        color: var(--primary, #111827) !important;
    }
    
    /* ── AI Fishing Analysis ─────────────────────────────────────── */
    .ai-analysis-panel {
        font-size: 14px !important;
        line-height: 1.65 !important;
        color: #4b5563 !important; /* light: neutral-600 */
        font-style: normal !important;
    }

    .dark .ai-analysis-panel {
        color: #e2e8f0  !important; /* dark: slate-300 */
    }

    .ai-analysis-panel * {
        font-style: normal !important;
    }

    .ai-analysis-panel p {
        margin: 0 0 10px 0 !important;
    }

    .ai-analysis-panel h3,
    .ai-analysis-panel h4 {
        margin: 20px 0 3px 0 !important;
        font-family: inherit !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        color: #374151 !important; /* light: neutral-700 */
    }

    .dark .ai-analysis-panel h3,
    .dark .ai-analysis-panel h4 {
        color: #e5e7eb !important; /* dark: neutral-200 */
    }

    .ai-analysis-panel strong {
        color: #1f2937 !important; /* light: neutral-800 */
        font-weight: 600 !important;
    }

    .dark .ai-analysis-panel strong {
        color: #e2e8f0 !important; /* dark */
    }

    .ai-analysis-panel ul {
        list-style: none !important;
        margin: 4px 0 12px 0 !important;  /* menjorok ke kiri */
        padding-left: 22px !important;
    }

    .ai-analysis-panel li {
        position: relative !important;
        display: block !important;
        margin: 5px 0 !important;
        padding-left: 16px !important;
    }

    .ai-analysis-panel li::before {
        content: "•";
        position: absolute;
        left: 0;
        top: 0;
        color: #64748b; /* light */
        font-size: 0.85em;
        line-height: inherit;
    }

    .dark .ai-analysis-panel li::before {
        color: #94a3b8; /* dark */
    }

    .ai-analysis-model {
        margin-top: 12px !important;
        font-size: 12px !important;
        color: #6b7280 !important; /* light: neutral-500 */
        font-family: monospace !important;
    }

    .dark .ai-analysis-model {
        color: #9ca3af !important; /* dark: neutral-400 */
    }

    /* ── AI Analysis title divider ─────────────────────────────── */
    .ai-analysis-divider {
        width: 100% !important;
        height: 0 !important;
        border-top: 1px solid #e5e5e5 !important; /* neutral-200 */
        opacity: 0.5 !important;
        margin: 12px 0 22px 0 !important;
    }

    .dark .ai-analysis-divider {
        border-top-color: #e5e5e5 !important; /* neutral-800/60 */
    }

</style>
