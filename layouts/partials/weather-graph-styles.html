{{/*
    weather-graph-styles.html
    CSS terpusat untuk semua graph di weather page.
    Di-include SEKALI di weather-page.html sebelum blueprint calls.
    Jangan include di tempat lain — akan duplicate style.
*/}}
<style>
    /* ── Graph container ─────────────────────────────────────────── */
    .telemetry-container {
        background-color: transparent !important;
        overflow: visible !important;
    }

    /* Jarak antar graph */
    .weather-graph-grid {
        row-gap: 32px !important;
    }

    /* Wrapper graph dari weather-page.html */
    .graph-scroll {
        width: 100%;
        min-width: 0;
        background: transparent;
        overflow: hidden;
    }

    /* Mobile only: horizontal slider */
    @media (max-width: 767px) {
        .weather-graph-grid {
            row-gap: 42px !important;
        }

        /* graph-scroll tidak scroll — biarkan title dan legend tetap centered */
        .graph-scroll {
            overflow: visible !important;
        }

        /* Scroll hanya pada SVG container */
        .telemetry-container {
            overflow-x: auto !important;
            overflow-y: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            padding-bottom: 14px !important;
        }

        .responsive-svg {
            width: 750px !important;
            min-width: 750px !important;
            max-width: none !important;
            height: auto !important;
        }
    }

    /* Desktop/tablet: no slider, graph fit column */
    @media (min-width: 768px) {
        .responsive-svg {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            height: auto !important;
        }
    }

    /* ── Fish activity list ───────────────────────────────────── */
    .fish-activity-list {
        display: inline-flex !important;
        flex-direction: column !important;
        gap: 3px !important;
        text-align: left !important;
        vertical-align: top !important;
    }

    .fish-activity-row {
        display: flex !important;
        gap: 6px !important;
        align-items: baseline !important;
        font-size: 14px !important;
        line-height: 1.35 !important;
    }

    .fish-activity-label {
        font-weight: 600 !important;
        color: #334155 !important;
        min-width: 42px !important;
    }

    .dark .fish-activity-label {
        color: #e2e8f0 !important;
    }

    .fish-activity-text {
        font-weight: 500 !important;
        color: #475569 !important;
    }

    .dark .fish-activity-text {
        color: #cbd5e1 !important;
    }

    .fish-activity-low .fish-activity-text {
        opacity: 0.82 !important;
    }

    @media (max-width: 767px) {
        .fish-activity-row {
            font-size: 13px !important;
        }

        .fish-activity-label {
            min-width: 38px !important;
        }
    }

    /* ── Safety status block ───────────────────────────────────── */
    .safety-status-block {
        text-align: center !important;
    }

    .safety-status-title {
        font-size: 15px !important;
        line-height: 1.35 !important;
        font-weight: 700 !important;
        color: var(--safety-color, #10b981) !important;
        text-transform: uppercase !important;
    }

    .safety-status-detail {
        margin-top: 4px !important;
        font-size: 14px !important;
        line-height: 1.45 !important;
        font-weight: 400 !important;
        color: #64748b !important;
    }

    .dark .safety-status-detail {
        color: #93a4b8 !important;
    }

    .safety-status-detail strong {
        font-weight: 600 !important;
        color: #1f2937 !important;
    }

    .dark .safety-status-detail strong {
        color: #e2e8f0 !important;
    }

    @media (max-width: 767px) {
        .safety-status-title {
            font-size: 14px !important;
        }

        .safety-status-detail {
            font-size: 13px !important;
        }
    }    

    /* ── Grid lines ──────────────────────────────────────────────── */
    .chart-grid-line { stroke: #e5e7eb; }
    .dark .chart-grid-line { stroke: #ffffff13; }

    /* ── Text sizes ──────────────────────────────────────────────── */
    .svg-text-micro  { font-size: 13px !important; }
    .svg-text-small  { font-size: 14px !important; }
    .font-size-micro { font-size: 14px !important; line-height: 20px !important; }

    /* ── Legend layout ───────────────────────────────────────────── */
    .legend-gap {
        display: flex !important; flex-wrap: wrap !important;
        align-items: center !important; gap: 12px 28px !important;
    }

    /* ── Series colours ──────────────────────────────────────────── */
    /* Wave — purple */
    .color-wave       { color: #9522ac; }
    .dark .color-wave { color: #d96fee; }

    /* Swell — blue */
    .color-swell       { color: #1871c5; }
    .dark .color-swell { color: #1d8cf3; }

    /* Tide — grey */
    .color-tide       { color: #7c7c7c; }
    .dark .color-tide { color: #9ca3af; }

    /* Wind — teal */
    .color-wind       { color: #0d9488; }
    .dark .color-wind { color: #2dd4bf; }

    /* Gust — orange */
    .color-gust       { color: #ea580c; }
    .dark .color-gust { color: #fb923c; }

    /* Dangerous threshold marker */
    .color-dangerous { color: #ef4444; }

    /* Wind direction arrow */
    .wind-direction-arrow {
        cursor: pointer;
        transition:
            opacity 0.12s ease,
            filter 0.12s ease;
    }

    .wind-direction-arrow:hover {
        filter: brightness(1.25);
    }

    /* Gust marker */
    .wind-gust-marker {
        cursor: pointer;
        transition:
            opacity 0.12s ease,
            transform 0.12s ease;
    }

    /* Gust line visually separated from sustained wind */
    #gust-wind-path {
        stroke-dasharray: 5 4;
        stroke-width: 1.6;
    }

    /* Shared interactive graph marker */
    .graph-point {
        cursor: pointer;
    }  
    /* ── Risk-coloured graph markers ───────────────────────── */

    .risk-colored-marker {
        vector-effect: non-scaling-stroke;
        transition:
            r 0.12s ease,
            fill 0.18s ease,
            stroke 0.18s ease,
            filter 0.12s ease;
    }

    .risk-colored-marker:hover {
        filter:
            brightness(1.12)
            drop-shadow(0 0 2px var(--marker-risk-color));
    }
      
    .marker-risk-legend {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;

        gap: 8px;
        margin-top: 4px;

        font-size: 12px;
        line-height: 1.35;
        color: #64748b;
    }

    .dark .marker-risk-legend {
        color: #94a3b8;
    }

    .marker-risk-gradient {
        display: inline-block;

        width: 120px;
        height: 8px;

        border-radius: 999px;

        background: linear-gradient(
            90deg,
            #22c55e 0%,
            #eab308 50%,
            #f97316 80%,
            #ef4444 100%,
            #7f1d1d 100%
        );
    }


    .color-temperature {
        color: #dc2626;
    }

    .dark .color-temperature {
        color: #f87171;
    }

    .color-apparent {
        color: #d97706;
    }

    .dark .color-apparent {
        color: #fbbf24;
    }

    .color-pressure {
        color: #7c3aed;
    }

    .dark .color-pressure {
        color: #a78bfa;
    }
    
    /* ── Precipitation dual-axis graph ─────────────────────── */

    /* Precipitation bars */
    .color-precipitation {
        color: #0284c7;
    }

    .dark .color-precipitation {
        color: #38bdf8;
    }

    /* Probability line */
    .color-rain-probability {
        color: #2563eb;
    }

    .dark .color-rain-probability {
        color: #60a5fa;
    }

    .precipitation-bar {
        fill: currentColor;
        opacity: 0.48;
        transition:
            opacity 0.12s ease,
            filter 0.12s ease;
    }

    .rain-hour-point:hover .precipitation-bar {
        opacity: 0.9;
        filter: brightness(1.1);
    }

    /*
    * Transparent hourly hit target so tooltip still works when
    * precipitation is exactly 0 mm.
    */
    .rain-hit-area {
        fill: transparent;
        pointer-events: all;
    }

    .precipitation-probability-dot {
        fill: currentColor;
        stroke: var(--entry, #ffffff);
        stroke-width: 1.5;
    }

    .dark .precipitation-probability-dot {
        stroke: var(--entry, #1f2937);
    }

    #probability-rain-path {
        stroke-linejoin: round;
        stroke-linecap: round;
    }

    .rain-bar-legend {
        display: inline-block;
        width: 16px;
        height: 9px;
        border-radius: 2px;
        background-color: currentColor;
        opacity: 0.55;
    }

    /* ── Dot interactivity ───────────────────────────────────────── */
    .graph-dot {
        r: 5px !important;
        transition: r 0.12s ease;
        cursor: pointer;
    }
    .graph-dot:hover { 
        r: 10px !important;
    }
    /* ── Tooltip ─────────────────────────────────────────────────── */
    .custom-graph-tooltip {
        position: absolute;
        display: none;
        pointer-events: none;
        background-color: color-mix(in srgb, var(--entry, #ffffff) 92%, transparent) !important;
        border: 1.5px solid var(--border, #e5e7eb) !important;
        border-radius: 6px !important;
        padding: 4px 6px !important;
        font-family: inherit !important;
        font-size: 11px !important;
        z-index: 50 !important;
        color: var(--primary, #1f2937) !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        width: max-content !important;
    }

    .tt-head {
        display: flex !important;
        justify-content: center !important;
        align-items: baseline !important;
        gap: 4px !important;
        margin-bottom: 3px !important;
        white-space: nowrap !important;
    }

    .tt-label {
        font-size: 11px !important;
        line-height: 1 !important;
        font-weight: 600 !important;
    }

    .tt-value {
        font-size: 12px !important;
        line-height: 1 !important;
        font-weight: 700 !important;
        text-align: center !important;
    }
    /* ── AI Fishing Analysis ─────────────────────────────────────── */
    .ai-analysis-panel {
        font-size: 14px !important;
        line-height: 1.65 !important;
        color: #4b5563 !important; /* light: neutral-600 */
        font-style: normal !important;
    }

    .dark .ai-analysis-panel {
        color: #e2e8f0  !important; /* dark: slate-300 */
    }

    .ai-analysis-panel * {
        font-style: normal !important;
    }

    .ai-analysis-panel p {
        margin: 0 0 10px 0 !important;
    }

    .ai-analysis-panel h3,
    .ai-analysis-panel h4 {
        margin: 20px 0 3px 0 !important;
        font-family: inherit !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        color: #374151 !important;
    }

    .dark .ai-analysis-panel h3,
    .dark .ai-analysis-panel h4 {
        color: #f8fafc !important;
    }

    .ai-analysis-panel strong {
        color: #111827 !important;
        font-weight: 700 !important;
    }

    .dark .ai-analysis-panel strong {
        color: #f1f5f9 !important;
        font-weight: 700 !important;
    }

    .ai-analysis-panel ul {
        list-style: none !important;
        margin: 4px 0 12px 0 !important;  /* menjorok ke kiri */
        padding-left: 22px !important;
    }

    .ai-analysis-panel li {
        position: relative !important;
        display: block !important;
        margin: 5px 0 !important;
        padding-left: 16px !important;
    }

    .ai-analysis-panel li::before {
        content: "•";
        position: absolute;
        left: 0;
        top: 0;
        color: #64748b; /* light */
        font-size: 0.85em;
        line-height: inherit;
    }

    .dark .ai-analysis-panel li::before {
        color: #94a3b8; /* dark */
    }

    .ai-analysis-model {
        margin-top: 12px !important;
        font-size: 12px !important;
        color: #6b7280 !important; /* light: neutral-500 */
        font-family: monospace !important;
    }

    .dark .ai-analysis-model {
        color: #9ca3af !important; /* dark: neutral-400 */
    }

    /* ── AI Analysis title divider ─────────────────────────────── */
    .ai-analysis-divider {
        width: 100% !important;
        height: 0 !important;
        border-top: 1px solid #e5e5e5 !important; /* neutral-200 */
        opacity: 0.5 !important;
        margin: 12px 0 22px 0 !important;
    }

    .dark .ai-analysis-divider {
        border-top-color: #e5e5e5 !important; /* neutral-800/60 */
    }

</style>
