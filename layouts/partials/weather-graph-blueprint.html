{{ $id := .id }}
{{ $title := .title }}
{{ $y_unit := .y_unit }}
{{ $y_max := .y_max | default 1.0 }}
{{ $danger_val := .danger_val | default 0.0 }}

{{ $ratio := div (float $danger_val) (float $y_max) }}
{{ $offset := mul $ratio 320 }}
{{ $danger_y := sub 360 $offset }}

<div class="w-full space-y-3 text-neutral-600 dark:text-neutral-400">
    <div class="flex justify-center items-center w-full">
        <h3 class="text-s font-mono font-bold text-neutral-700 dark:text-neutral-300 uppercase tracking-wider">
            {{ $title }}
        </h3>
    </div>
    <div class="telemetry-container py-2 font-mono relative overflow-x-auto select-none w-full" style="-webkit-overflow-scrolling: touch;">
        <svg id="telemetry-svg-{{ $id }}" viewBox="0 0 900 410" class="responsive-svg w-full h-auto block" xmlns="http://www.w3.org/2000/svg">
            {{ range $i := seq 40 40 360 }}
                <line x1="60" y1="{{ $i }}" x2="840" y2="{{ $i }}" class="chart-grid-line" stroke-width="1" />
            {{ end }}


            <line x1="60" y1="40"  x2="840" y2="40"  stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="80"  x2="840" y2="80"  stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="120" x2="840" y2="120" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="160" x2="840" y2="160" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="200" x2="840" y2="200" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="240" x2="840" y2="240" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="280" x2="840" y2="280" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="320" x2="840" y2="320" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <line x1="60" y1="360" x2="840" y2="360" stroke="currentColor" stroke-width="1" opacity="0.15"/>

            <line x1="60" y1="{{ $danger_y }}" x2="840" y2="{{ $danger_y }}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.9" />
            
            <line x1="60" y1="30" x2="60" y2="370" stroke="currentColor" stroke-width="1" opacity="0.3" />
            <line x1="840" y1="30" x2="840" y2="370" stroke="currentColor" stroke-width="1" opacity="0.3" />
            <line x1="60" y1="360" x2="840" y2="360" stroke="currentColor" stroke-width="1" opacity="0.3" />
            
            <text x="80" y="20" fill="currentColor" text-anchor="end" class="svg-text-micro opacity-50">{{ $y_unit }}</text>
            <text x="800" y="20" fill="currentColor" text-anchor="start" class="svg-text-micro opacity-50">{{ $y_unit }}</text>
            
            <g fill="currentColor" class="svg-text-small">
                {{ range $i, $label := .labels }}
                    {{ $y_pos := add 44 (mul $i 40) }}
                    {{ $isDanger := eq (float $label) (float $danger_val) }}
                    <text x="50" y="{{ $y_pos }}" text-anchor="end" class="{{ if $isDanger }}font-bold text-red-500{{ end }}">{{ $label }}</text>
                    <text x="848" y="{{ $y_pos }}" text-anchor="start" class="{{ if $isDanger }}font-bold text-red-500{{ end }}">{{ $label }}</text>
                {{ end }}
            </g>

            <g fill="currentColor" opacity="0.4">
                {{ range $x := seq 60 65 840 }}
                    <circle cx="{{ $x }}" cy="360" r="2" />
                {{ end }}
            </g>
            <g fill="currentColor" class="svg-text-small" text-anchor="middle">
                {{ $times := slice "00:00" "02:00" "04:00" "06:00" "08:00" "10:00" "12:00" "14:00" "16:00" "18:00" "20:00" "22:00" "24:00" }}
                {{ range $i, $x := seq 60 65 840 }}
                    <text x="{{ $x }}" y="392">{{ index $times $i }}</text>
                {{ end }}
            </g>

            <line id="time-line-{{ $id }}" x1="-10" y1="40" x2="-10" y2="360" stroke="#FFDD00" stroke-width="1.5" opacity="0.8" />
            <text id="time-text-{{ $id }}" x="-10" y="33" fill="#FFDD00" text-anchor="middle" class="svg-text-micro font-bold"></text>
        </svg>
    </div>
</div>
