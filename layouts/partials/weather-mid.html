<script>
    (function() {
        function updateCurrentTimeIndicator() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            
            // Total lebar sumbu X grafik adalah dari x=60 (00:00) ke x=840 (24:00) -> total 780px.
            // 780px / 24 jam = 32.5px per jam.
            const startX = 60;
            const pxPerHour = 32.5;
            
            // Hitung posisi X presisi
            const currentX = startX + (hours * pxPerHour) + (minutes * (pxPerHour / 60));
            
            const line = document.getElementById('current-time-line');
            const text = document.getElementById('current-time-text');
            
            if (line && text) {
                // Pastikan penanda hanya muncul jika berada dalam rentang box grafik
                if (currentX >= 60 && currentX <= 840) {
                    line.setAttribute('x1', currentX);
                    line.setAttribute('x2', currentX);
                    
                    text.setAttribute('x', currentX);
                    // Format text jam:menit (misal 14:05)
                    const formattedTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    text.textContent = `CURRENT TIME(${formattedTime})`;
                    
                    line.style.display = 'block';
                    text.style.display = 'block';
                } else {
                    line.style.display = 'none';
                    text.style.display = 'none';
                }
            }
        }

        // Jalankan saat load pertama kali
        updateCurrentTimeIndicator();
        // Update setiap 30 detik agar jarum waktu bergerak presisi
        setInterval(updateCurrentTimeIndicator, 30000);
    })();
</script>
