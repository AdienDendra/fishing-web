<style>
    .telemetry-container {
        background-color: transparent !important;
    }
    
    /* Grid Lines Sumbu Grafik */
    .chart-grid-line { stroke: #e5e7eb; }
    .dark .chart-grid-line { stroke: #ffffff13; }
    
    /* Font Size Scaler Micro SVG */
    .svg-text-micro { font-size: 10px !important; }
    .svg-text-small { font-size: 11px !important; }
    
    /* Paksa Ukuran Font Legenda Menjadi Mikro & Pas via CSS Murni */
    .font-size-micro { font-size: 12px !important; line-height: 12px !important; }
    
    /* Paksa Jarak (Gap) Legenda via CSS Murni */
    .legend-gap {
        display: flex !important;
        flex-wrap: wrap !important;
        align-items: center !important;
        gap: 12px 28px !important;
    }
    
    /* Diferensiasi Warna Komponen Cuaca (Purple, Teal, Orange) */
    .color-wave { color: #9522ac; }
    .dark .color-wave { color: #d96fee; }
    
    .color-swell { color: #1871c5; }
    .dark .color-swell { color: #1d8cf3; }
    
    .color-tide { color: #7c7c7c; }
    .dark .color-tide { color: #7c7c7c; }

    .color-dangerous { color: #ff0000; }
    .dark .color-dangerous { color: #ff0000; }
    
    /* Interaktivitas Node Titik Data */
    .graph-dot { 
        transition: transform 0.1s ease, r 0.1s ease; 
        cursor: pointer; 
    }
    .graph-dot:hover { 
        r: 4.5px; 
    }

    /* FIX: OPACITY 70% & SPACING SIMETRIS PAS KONTEN */
    .custom-graph-tooltip {
        position: absolute;
        display: none;
        pointer-events: none;
        /* Mencampur warna tema dengan transparan untuk mendapatkan opacity 90% murni pada background saja */
        background-color: color-mix(in srgb, var(--entry, #ffffff) 90%, transparent) !important;
        border: 1.5px solid var(--border, #e5e7eb) !important;
        border-radius: 6px !important;
        padding: 6px 10px !important; /* Spacing kiri-kanan diatur sama rata (10px) */
        font-family: inherit !important;
        font-size: 11px !important;
        z-index: 50 !important;
        color: var(--primary, #1f2937) !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        width: max-content !important; /* Mengikuti lebar teks asli agar tidak ada space sisa di kanan */
    }

    /* Spacing Internal Konten Tooltip */
    .tt-title { 
        font-weight: bold; 
        font-size: 12px !important; 
        text-transform: uppercase; 
        margin-bottom: 2px !important; 
        line-height: 1.2 !important;
    }
    .tt-row { 
        color: var(--secondary, #4b5563) !important;
        font-weight: 500; 
        margin-top: 1px !important; 
        line-height: 1.2 !important;
    }
    .tt-num { 
        font-weight: bold; 
        color: var(--primary, #111827) !important; 
    }

    /* FIX RESPONSIVITAS MOBILE */
    @media (max-width: 767px) {
        #ocean-telemetry-svg {
            width: 900px !important;
            min-width: 900px !important;
            max-width: none !important;
            height: auto !important;
        }
    }
</style>

<script>
    (function() {
        // --- Indicator Waktu Sekarang ---
        function updateCurrentTimeIndicator() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const startX = 60;
            const pxPerHour = 32.5; 
            
            const currentX = startX + (hours * pxPerHour) + (minutes * (pxPerHour / 60));
            const line = document.getElementById('current-time-line');
            const text = document.getElementById('current-time-text');
            
            if (line && text) {
                if (currentX >= 60 && currentX <= 840) {
                    line.setAttribute('x1', currentX);
                    line.setAttribute('x2', currentX);
                    text.setAttribute('x', currentX);
                    const formattedTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    text.textContent = `CURRENT TIME (${formattedTime})`;
                    line.style.display = 'block';
                    text.style.display = 'block';
                } else {
                    line.style.display = 'none';
                    text.style.display = 'none';
                }
            }
        }

        updateCurrentTimeIndicator();
        setInterval(updateCurrentTimeIndicator, 30000);

        // --- Interaktivitas Pop-up Tooltip Precision ---
        const svg = document.getElementById('ocean-telemetry-svg');
        const container = svg.closest('.telemetry-container');
        
        const tooltip = document.createElement('div');
        tooltip.className = 'custom-graph-tooltip';
        container.appendChild(tooltip);

        const dots = svg.querySelectorAll('.graph-dot');
        
        dots.forEach(dot => {
            dot.addEventListener('mouseenter', showTooltip);
            dot.addEventListener('mousemove', moveTooltip);
            dot.addEventListener('mouseleave', hideTooltip);
        });

        function showTooltip(e) {
            const dot = e.target;
            const cy = parseFloat(dot.getAttribute('cy'));
            const cx = parseFloat(dot.getAttribute('cx'));
            
            const hourCalculated = Math.round((cx - 60) / 32.5);
            const timeStr = `${String(hourCalculated).padStart(2, '0')}:00`;

            let typeLabel = '';
            let typeClass = '';
            let showPeriod = false;
            
            if (dot.classList.contains('color-wave')) {
                typeLabel = 'Wave';
                typeClass = 'color-wave';
                showPeriod = true;
            } else if (dot.classList.contains('color-swell')) {
                typeLabel = 'Swell';
                typeClass = 'color-swell';
                showPeriod = true;
            } else if (dot.classList.contains('color-tide')) {
                typeLabel = 'Tide';
                typeClass = 'color-tide';
                showPeriod = false;
            }
            
            const height = ((360 - cy) / 80).toFixed(2);
            const period = (((360 - cy) / 320) * 24).toFixed(2);
            
            let content = `<div class="tt-title ${typeClass}">${typeLabel} (${timeStr})</div>`;
            content += `<div class="tt-row">height: <span class="tt-num">${height}m</span></div>`;
            
            if (showPeriod) {
                content += `<div class="tt-row">period: <span class="tt-num">${period}s</span></div>`;
            }
            
            tooltip.innerHTML = content;
            tooltip.style.display = 'block';
        }

        function moveTooltip(e) {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left + container.scrollLeft;
            const y = e.clientY - rect.top + container.scrollTop;
            
            tooltip.style.left = `${x + 12}px`; 
            tooltip.style.top = `${y - 12}px`;
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }
    })();
</script>
