<script>
  document.addEventListener("DOMContentLoaded", function() {
    const currentPath = window.location.pathname;
    
    // Mengecek apakah URL diawali dengan /documentation ATAU /weather
    if (currentPath.startsWith("/documentation") || currentPath.startsWith("/weather")) {
      const style = document.createElement("style");
      style.innerHTML = `
        /* 1. Aturan Global Body & Batas Lebar */
        body {
            max-width: 1360px !important;
        }

        /* RESPONSIVITAS GAP: Hanya terapkan padding lebar di Desktop (min-width: 768px) */
        @media (min-width: 768px) {
            body {
                padding-left: 2.5rem !important;
                padding-right: 2.5rem !important;
            }
        }

        /* RESPONSIVITAS GAP: Sesuaikan untuk Mobile (max-width: 767px) */
        @media (max-width: 767px) {
            body {
                /* Perkecil padding agar ruang baca di HP jauh lebih luas */
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            
            /* Khusus kontainer grafik telemetry agar bisa scroll full-bleed dari ujung ke ujung layar HP */
            .telemetry-container {
                margin-left: -1rem !important;
                margin-right: -1rem !important;
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }

        /* 2. Dobrak batas lebar kontainer internal (Documentation & Weather) */
        #single_header,
        .max-w-prose,
        .prose,
        article,
        .custom-wide-container {
            max-width: 100% !important;
            width: 100% !important;
        }
      `;
      document.head.appendChild(style);
    }
  });
</script>
