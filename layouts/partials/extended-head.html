<!-- PWA Manifest Link -->
<link rel="manifest" href="/manifest.webmanifest" />

<!-- iOS PWA Meta Tags -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Blowfish PWA" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<!-- Service Worker Registration Script -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered successfully.', reg))
        .catch(err => console.log('Service Worker registration failed.', err));
    });
  }
</script>

{{ if eq .Layout "docs" }}
<style>
    /* Mendobrak seluruh layer pembatas lebar bawaan tema Blowfish */
    .prose, 
    .max-w-prose, 
    .max-w-3xl, 
    .lg\:max-w-3xl {
        max-width: 1280px !important; /* Anda bisa menggantinya ke 1440px atau 100% sesuai kebutuhan */
    }
</style>
{{ end }}
