<script>
    (function() {
        function updateTimeline() {
            const now = new Date(); const hours = now.getHours(); const minutes = now.getMinutes();
            const currentX = 60 + (hours * 32.5) + (minutes * (32.5 / 60));
            const line = document.getElementById('time-line-2'); const text = document.getElementById('time-text-2');
            if (line && text) {
                if (currentX >= 60 && currentX <= 840) {
                    line.setAttribute('x1', currentX); line.setAttribute('x2', currentX); text.setAttribute('x', currentX);
                    text.textContent = `CURRENT TIME (${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')})`;
                    line.style.display = 'block'; text.style.display = 'block';
                } else { line.style.display = 'none'; text.style.display = 'none'; }
            }
        }
        updateTimeline(); setInterval(updateTimeline, 30000);

        const svg = document.getElementById('period-telemetry-svg'); const container = svg.closest('.telemetry-container');
        const tooltip = document.createElement('div'); tooltip.className = 'custom-graph-tooltip'; container.appendChild(tooltip);

        svg.querySelectorAll('.graph-dot').forEach(dot => {
            dot.addEventListener('mouseenter', showTooltip); dot.addEventListener('mousemove', moveTooltip);
            dot.addEventListener('mouseleave', () => tooltip.style.display = 'none');
        });

        function showTooltip(e) {
            const dot = e.target; const cy = parseFloat(dot.getAttribute('cy')); const cx = parseFloat(dot.getAttribute('cx'));
            const timeStr = `${String(Math.round((cx - 60) / 32.5)).padStart(2, '0')}:00`;
            let label = dot.classList.contains('color-wave') ? 'Wave' : 'Swell';
            let cls = dot.classList.contains('color-wave') ? 'color-wave' : 'color-swell';
            const period = dot.getAttribute('data-value') || ((360 - cy) / 16).toFixed(1);
            tooltip.innerHTML = `<div class="tt-title ${cls}">${label} (${timeStr})</div><div class="tt-row">period: <span class="tt-num">${period}s</span></div>`;
            tooltip.style.display = 'block';
        }
        function moveTooltip(e) {
            const rect = container.getBoundingClientRect();
            tooltip.style.left = `${e.clientX - rect.left + container.scrollLeft + 12}px`;
            tooltip.style.top = `${e.clientY - rect.top + container.scrollTop - 12}px`;
        }
    })();
</script>
