<style>
    .status-indicator-dot { background-color: #10b981; }
    .status-text-green { color: #059669; }
    .dark .status-text-green { color: #34d399; }
    .live-ping-animation { animation: faultless-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes faultless-ping { 75%, 100% { transform: scale(2.5); opacity: 0; } }

    /* LAYOUT UTAMA UTK HEADER KONTROL (MOBILE: STACKED GRID) */
    .geo-header-row { display: flex !important; flex-direction: column !important; gap: 14px !important; width: 100% !important; }
    .geo-left-group { display: flex !important; flex-direction: column !important; width: 100% !important; }
    
    /* Grid Engine untuk Mobile (2 Kolom) */
    .geo-fields-container { 
        display: grid !important; 
        grid-template-columns: 1fr auto !important; 
        gap: 10px !important; 
        width: 100% !important; 
    }
    .geo-loc-wrapper { grid-column: span 2 !important; } /* Baris 1: Full-width */
    .geo-date-wrapper { grid-column: span 1 !important; } /* Baris 2 */
    
    .geo-input-wrapper { display: flex !important; align-items: center !important; gap: 8px !important; width: 100% !important; }
    .geo-input-field, .geo-select-field { width: 100% !important; min-width: 0 !important; }
    
    /* Membuat teks label "Location:" dan "Date:" sejajar rata kiri pada mobile */
    .geo-label { min-width: 70px !important; display: inline-block !important; flex-shrink: 0 !important; }
    
    /* Data Updated rata kiri di mobile */
    .geo-right-group { text-align: left !important; width: 100% !important; }

    /* RESPONSIVITAS DESKTOP (BREAKPOINT SM / 640px ke atas) */
    @media (min-width: 640px) {
        .geo-header-row { flex-direction: row !important; justify-content: space-between !important; align-items: center !important; }
        .geo-left-group { flex-direction: row !important; align-items: center !important; width: auto !important; }
        
        .geo-fields-container { display: flex !important; flex-wrap: nowrap !important; width: auto !important; }
        .geo-loc-wrapper, .geo-date-wrapper { grid-column: auto !important; width: auto !important; flex: none !important; }
        
        .geo-input-field { width: 180px !important; max-width: 180px !important; }
        .geo-select-field { width: 180px !important; max-width: 180px !important; }
        .geo-label { min-width: auto !important; }
        
        /* Kembalikan rata kanan saat di desktop */
        .geo-right-group { text-align: right !important; width: auto !important; }
    }

    /* TOMBOL CHECK */
    .geo-check-btn {
        background-color: #2563eb !important; color: #ffffff !important; font-weight: 600 !important;
        padding: 5px 14px !important; border-radius: 6px !important; border: none !important;
        cursor: pointer !important; display: inline-flex !important; align-items: center !important;
        justify-content: center !important; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
        flex-shrink: 0 !important; transition: background-color 0.1s ease-in-out, transform 0.05s ease !important;
    }
    .geo-check-btn:hover { background-color: #1d4ed8 !important; }
    .geo-check-btn:active { transform: scale(0.93) !important; background-color: #1e40af !important; }
    .dark .geo-check-btn { background-color: #3b82f6 !important; }
    .dark .geo-check-btn:hover { background-color: #2563eb !important; }
    .dark .geo-check-btn:active { transform: scale(0.93) !important; background-color: #1d4ed8 !important; }
    .geo-check-btn:disabled { opacity: 0.6 !important; cursor: not-allowed !important; transform: none !important; }

    /* TOMBOL MAP TRIGGER TRIGGER (📍) */
    .geo-map-trigger-btn {
        border-radius: 6px !important; padding: 0 10px !important; cursor: pointer !important;
        display: inline-flex !important; align-items: center !important; justify-content: center !important;
        height: 34px !important; transition: background-color 0.1s ease !important;
    }
    .geo-map-trigger-btn { background-color: #3b82f6 !important; }
    .geo-map-trigger-btn:hover { background-color: #2563eb !important; }
    .dark .geo-map-trigger-btn { background-color: #3b82f6 !important; }
    .dark .geo-map-trigger-btn:hover { background-color: #2563eb !important; }

    /* STYLING MODAL OPENSTREETMAP (DARK THEME COMPATIBLE) */
    .geo-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.6); z-index: 99999; align-items: center; justify-content: center;
        padding: 16px;
    }
    .geo-modal-content {
        background-color: #ffffff; border-radius: 8px; width: 100%; max-width: 850px;
        height: 80vh; max-height: 520px; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        display: flex !important;
        flex-direction: column !important;
    }
    /* GANTI BARIS INI DI KODE ANDA */
    .dark .geo-modal-content { 
        background-color: #1E293B; /* Mengganti #171717 dengan warna dasar navy dashboard Anda */
        border: 1px solid #2d3d4f; /* Mengganti #262626 dengan border biru gelap tipis agar rapi */
        display: flex !important;
        flex-direction: column !important;
    }
    
    .geo-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-bottom: 1px solid #e5e7eb;
    }
    .dark .geo-modal-header { border-bottom-color: #262626; }
    .geo-modal-title { font-weight: 600; color: #1f2937; }
    .dark .geo-modal-title { color: #f3f4f6; }
    .geo-modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #6b7280; }
    .dark .geo-modal-close { color: #a3a3a3; }
    
    .geo-map-sidebar { width: 100%; max-height: 140px; overflow-y: auto; background-color: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    @media (min-width: 640px) { .geo-map-sidebar { width: 32%; max-height: none; border-bottom: none; border-right: 1px solid #e5e7eb; } }
    .dark .geo-map-sidebar { background-color: #1c1c1c; border-color: #262626; }
    
    .geo-spot-list { list-style: none; padding: 0; margin: 0; }
    .geo-spot-item {
        padding: 10px 14px; border-bottom: 1px solid #e5e7eb; cursor: pointer;
        font-size: 13px; color: #4b5563; transition: background-color 0.1s;
    }
    .dark .geo-spot-item { border-bottom-color: #262626; color: #d4d4d4; }
    .geo-spot-item:hover, .geo-spot-item.active { background-color: #eff6ff; color: #1d4ed8; }
    .dark .geo-spot-item:hover, .dark .geo-spot-item.active { background-color: #1e3a8a; color: #eff6ff; }
    
    #geo-osm-render-zone { 
        width: 100% !important; 
        height: 100% !important; 
        min-height: 420px !important; 
        position: relative !important; 
        display: block !important;
    }

    /* Fix invert warna map tile jika server menggunakan global dark reader, biarkan tile default */
    .leaflet-tile-container { filter: none !important; }
    
    .leaflet-container img {
        max-width: none !important;
        max-height: none !important;
    }
    
</style>

<script>
    (function() {
        // Date select population
        function generateForecastDays() {
            const dateSelect = document.getElementById('date-select');
            if (!dateSelect) return;
            dateSelect.innerHTML = '';
            const daysOfWeek = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                let label = `${daysOfWeek[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
                if (i === 0) label = `Today (${label})`;
                if (i === 1) label = `Tomorrow (${label})`;
                const opt = document.createElement('option');
                opt.value = val; opt.textContent = label;
                dateSelect.appendChild(opt);
            }
        }
        generateForecastDays();

        // Map modal
        const modal   = document.getElementById('geo-map-modal-container');
        const openBtn = document.getElementById('geo-map-trigger');
        const closeBtn = document.getElementById('geo-modal-close-x');

        if (openBtn) openBtn.addEventListener('click', () => { modal.style.display = 'flex'; });
        if (closeBtn) closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    })();

    // Global — dipanggil dari button onclick di dalam modal
    function selectSpot(name, lat, lon) {
        const input = document.getElementById('location-input');
        if (input) input.value = name;
        
        // Update iframe marker ke lokasi yang dipilih
        const iframe = document.getElementById('geo-osm-iframe');
        if (iframe) {
            iframe.src = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.3}%2C${lat-0.2}%2C${lon+0.3}%2C${lat+0.2}&layer=mapnik&marker=${lat}%2C${lon}`;
        }

        // Tutup modal dan trigger fetch
        document.getElementById('geo-map-modal-container').style.display = 'none';
        const checkBtn = document.getElementById('weather-check-btn');
        if (checkBtn) checkBtn.click();
    }
</script>

<script src="/js/weather-fetch.js"></script>
