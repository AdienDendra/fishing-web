<style>
    .status-indicator-dot { background-color: #10b981; }
    .status-text-green { color: #059669; }
    .dark .status-text-green { color: #34d399; }
    .live-ping-animation { animation: faultless-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes faultless-ping { 75%, 100% { transform: scale(2.5); opacity: 0; } }

    /* FIXED HEADER ROW LAYOUT */
    .geo-header-row { display: flex !important; flex-direction: column !important; gap: 12px !important; width: 100% !important; }
    .geo-left-group { display: flex !important; align-items: center !important; gap: 8px !important; width: 100% !important; }
    .geo-input-wrapper { display: flex !important; align-items: center !important; gap: 10px !important; flex: 1 1 auto !important; min-width: 0 !important; }
    .geo-input-field { width: 100% !important; min-width: 0 !important; }
    .geo-right-group { text-align: left !important; width: 100% !important; }

    @media (min-width: 640px) {
        .geo-header-row { flex-direction: row !important; justify-content: space-between !important; align-items: center !important; }
        .geo-left-group { width: auto !important; }
        .geo-input-wrapper { width: auto !important; flex: none !important; }
        .geo-input-field { width: 170px !important; max-width: 170px !important; }
        .geo-right-group { text-align: right !important; width: auto !important; }
    }

    .geo-check-btn {
        background-color: #2563eb !important; color: #ffffff !important; font-weight: 600 !important;
        padding: 4px 14px !important; border-radius: 6px !important; border: none !important;
        cursor: pointer !important; display: inline-flex !important; align-items: center !important;
        justify-content: center !important; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
        flex-shrink: 0 !important; transition: background-color 0.1s ease-in-out, transform 0.05s ease !important;
    }
    .geo-check-btn:hover { background-color: #1d4ed8 !important; }
    .geo-check-btn:active { transform: scale(0.93) !important; background-color: #1e40af !important; }
    .dark .geo-check-btn { background-color: #3b82f6 !important; }
    .dark .geo-check-btn:hover { background-color: #2563eb !important; }
    .dark .geo-check-btn:active { transform: scale(0.93) !important; background-color: #1d4ed8 !important; }
</style>

<div class="w-full space-y-4">
    <div class="geo-header-row text-xs md:text-sm text-neutral-600 dark:text-neutral-400 font-mono">
        <div class="geo-left-group font-sans">
            <label for="location-input" class="font-medium text-neutral-800 dark:text-neutral-200 shrink-0">Location:</label>
            <div class="geo-input-wrapper">
                <input 
                    type="text" 
                    id="location-input" 
                    name="location" 
                    placeholder="-33.98048, 151.22513" 
                    class="geo-input-field bg-white dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 rounded-md px-3 py-1 text-xs sm:text-sm text-neutral-800 dark:text-neutral-100 font-mono placeholder-neutral-400 dark:placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                />
                <button type="button" id="weather-check-btn" class="geo-check-btn text-xs sm:text-sm">Check</button>
            </div>
        </div>

        <div class="geo-right-group text-neutral-600 dark:text-neutral-400 font-mono">
            <span>Updated: </span>
            <span class="font-semibold text-neutral-800 dark:text-neutral-200">May 20, 16:00 AEST</span>
        </div>
    </div>

    <div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>

    <div class="font-sans w-full">
        <div class="flex items-center justify-center text-center gap-2.5 text-sm w-full pb-1">
            <span class="flex h-2.5 w-2.5 relative shrink-0">
                <span class="status-indicator-dot live-ping-animation absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                <span class="status-indicator-dot relative inline-flex rounded-full h-2.5 w-2.5"></span>
            </span>
            <p class="leading-relaxed status-text-green">
                <strong>SAFETY STATUS:</strong> CONDITIONALLY SAFE <span class="text-neutral-500 dark:text-neutral-400">(Watch for Choppy Swells)</span>
            </p>
        </div>

        <div class="border-t border-neutral-200 dark:border-neutral-800/60 my-3 opacity-50"></div>

        <div class="flex flex-row justify-between items-center text-xs sm:text-sm font-mono text-neutral-600 dark:text-neutral-400 pt-1 w-full">
            <div class="w-1/3 flex items-center justify-start gap-1">
                <span>🌅 Sunrise:</span>
                <span class="font-semibold text-neutral-800 dark:text-neutral-200">06:50 AM</span>
            </div>
            <div class="w-1/3 flex items-center justify-center gap-1 border-x border-neutral-200 dark:border-neutral-800 px-2 text-center">
                <span>🌇 Sunset:</span>
                <span class="font-semibold text-neutral-800 dark:text-neutral-200">04:58 PM</span>
            </div>
            <div class="w-1/3 flex items-center justify-end gap-1 text-right">
                <span>🐟 Fish Activity:</span>
                <span class="font-semibold text-blue-600 dark:text-blue-400 whitespace-nowrap">Major (13:38 - 15:38)</span>
            </div>
        </div>
    </div>
</div>
