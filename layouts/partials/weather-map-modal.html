
<style>
    .geo-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.6); z-index: 99999;
        align-items: center; justify-content: center; padding: 16px;
    }
    .geo-modal-content {
        background-color: #ffffff; border-radius: 8px; width: 100%; max-width: 850px;
        height: 80vh; max-height: 520px;
        display: flex !important; flex-direction: column !important;
        overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .dark .geo-modal-content { background-color: #1E293B; border: 1px solid #2d3d4f; }
    .geo-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
    }
    .dark .geo-modal-header { border-bottom-color: #262626; }
    .geo-modal-title { font-weight: 600; font-size: 14px; color: #1f2937; }
    .dark .geo-modal-title { color: #f3f4f6; }
    .geo-modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #6b7280; line-height: 1; }
    .dark .geo-modal-close { color: #a3a3a3; }
    #geo-osm-render-zone { width: 100% !important; height: 100% !important; min-height: 400px !important; display: block !important; }
    .leaflet-tile-container { filter: none !important; }
    .leaflet-container img { max-width: none !important; max-height: none !important; }
</style>

<div id="geo-map-modal-container" class="geo-modal-overlay">
    <div class="geo-modal-content font-sans">
        <div class="geo-modal-header">
            <span class="geo-modal-title">Select Fishing Spot</span>
            <button type="button" id="geo-modal-close-x" class="geo-modal-close" aria-label="Close">&times;</button>
        </div>
        <div style="flex:1; min-height:0; overflow:hidden;">
            <div id="geo-osm-render-zone"></div>
        </div>
    </div>
</div>

<script src="/data/spots.js"></script>

<script>
    
(function () {

    console.log(window.SPOTS);

    var modal     = document.getElementById('geo-map-modal-container');
    var openBtn   = document.getElementById('geo-map-trigger');
    var closeBtn  = document.getElementById('geo-modal-close-x');
    var mapEngine = null;

    function closeModal() { modal.style.display = 'none'; }
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    window.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

    // Gunakan _Leaflet lokal — hindari conflict dengan window.L milik theme
    function buildMap(_Leaflet) {
        if (mapEngine) {
            setTimeout(function() { mapEngine.invalidateSize(); }, 100);
            return;
        }
        mapEngine = _Leaflet.map('geo-osm-render-zone', { zoomControl: true })
                            .setView([-33.95, 151.23], 11);

        _Leaflet.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors', maxZoom: 18
        }).addTo(mapEngine);

        var redIcon = _Leaflet.icon({
            iconUrl:    'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl:  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25,41], iconAnchor: [12,41], popupAnchor: [1,-34], shadowSize: [41,41]
        });

        SPOTS.forEach(function(spot) {
            _Leaflet.marker([spot.lat, spot.lng], { icon: redIcon })
                    .addTo(mapEngine)
                    .bindPopup(
                        '<div style="font-family:sans-serif;min-width:130px;">' +
                        '<strong style="display:block;margin-bottom:6px;font-size:13px;">' + spot.name + '</strong>' +
                        '<button onclick="window.selectFishingSpot(\'' + spot.name + '\',' + spot.lat + ',' + spot.lng + ')" ' +
                        'style="width:100%;background:#2563eb;color:#fff;border:none;padding:5px 0;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;">' +
                        '✓ Select This Spot</button></div>'
                    );
        });

        setTimeout(function() { mapEngine.invalidateSize(); }, 150);
    }

    function initLeafletMap() {
        // Simpan window.L yang mungkin sudah di-overwrite theme
        var savedL = window.L;

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
        js.onload = function() {
            // Ambil Leaflet dari window.L setelah load, simpan ke var lokal
            var _Leaflet = window.L;
            // Restore window.L ke nilai semula (milik theme)
            window.L = savedL;
            // Pakai _Leaflet lokal untuk build map
            buildMap(_Leaflet);
        };
        js.onerror = function() { console.error('[map-modal] Failed to load Leaflet from CDN'); };
        document.head.appendChild(js);
    }

    if (openBtn) {
        openBtn.addEventListener('click', function() {
            modal.style.display = 'flex';
            setTimeout(initLeafletMap, 300);
        });
    }

    window.selectFishingSpot = function(name, lat, lng) {
        var input = document.getElementById('location-input');
        if (input) input.value = name;
        closeModal();
    };
})();
</script>
